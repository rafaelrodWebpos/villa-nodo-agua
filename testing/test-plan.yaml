dut:
  board: Waveshare ESP32-S3-DEV-KIT-N8R8, módulo ESP32-S3-WROOM-1 N8R8 (clima:C-HW-01) + E/S de FSD §2.2
  target: esp32s3
  flash: 8MB (clima:C-HW-02)
  slot: SLOT2   # segunda Waveshare del banco; solo de banco: nunca se instala ni se le queman eFuses (propietario, 2026-11-14)
  identity:   # observado por /commission el 2026-11-14 (agenda, fila 1)
    recorded_in: 645f35e   # firmware observado: commissioning.forward_path
    chip: ESP32-S3 (QFN56), revisión v0.2
    features: Wi-Fi, BT 5 (LE), Dual Core + LP Core, 240MHz, Embedded PSRAM 8MB (AP_3v3)
    flash: 8MB detectados (fabricante 20, dispositivo 4017; quad por eFuse, 3,3 V)
    usb: USB-Serial/JTAG (ttyACM del slot en el Pi)
    mac: b8:f8:62:7f:9a:f8
    read_by: POST /api/chip/info SLOT2 (esptool v5.6.0 en el Pi), returncode 0
    matches: clima:C-HW-01, clima:C-HW-02 (la PSRAM existe pero el firmware no la requiere, clima:C-HW-03)
    efuses_observed: >
      2026-11-14, espefuse summary por RFC2217 desde nodo-clima-piloto-dev (IDF 6.0):
      SECURE_BOOT_EN=0, SPI_BOOT_CRYPT_CNT=0b000, KEY_PURPOSE_0..5=USER (0x0),
      DIS_DOWNLOAD_MODE=0, ENABLE_SECURITY_DOWNLOAD=0, SECURE_VERSION=0, RD_DIS=0.
      2026-11-18, tras soldar los pines (paso 0): los mismos valores y WR_DIS=0;
      chip/info: ESP32-S3 (QFN56) v0.2, 8MB, la misma MAC
    publication: >
      la MAC se publica: la placa es unidad permanente del banco y nunca se
      instala (propietario, 2026-11-14; mismo criterio que el piloto, H-20 /
      NFR-SEC-01). Las unidades que se instalen no aparecen en el repo público
  boot_marker: "Init complete"            # última línea de app_main (contrato del testbench)
  bench_image_marker: NODO-BENCH-IMAGE    # solo en la imagen de banco (C-LOG-01)
  efuses: nunca se queman en una placa del banco (C-SEC-A3)

testbench:
  status: montado (compartido con villa-nodo-clima-piloto)
  hostname: testbench-b99c   # GET /api/info 2026-11-14; 4 slots configurados, 2 corriendo (SLOT1, SLOT2). La IP no se versiona (.env)
  address: no se versiona — el repo es público; se lee de .env (ignorado por git)
  reported: 2026-11-14   # GET /api/info: ok, build b5623c4, capabilities [bench-ap-internet, bench-sntp-block, bench-dns-override, bench-mqtt-auth, bench-traffic-capture, bench-serial-write]
  note: >
    Las capacidades del banco se copian de lo que el banco reporta (y de la
    declaración del piloto en el mismo banco) y se declaran yes sin prueba
    propia. Lo que el banco no tiene queda en no con su motivo y su CR-TB.
  grabado: >
    2026-11-15, portado del piloto (36fcf48): POST /api/flash del banco recorta los
    blancos finales de cada binario (bytes.strip() en el fork hasta b5623c4, el build
    fijado aquí; arreglado en villa-2 f50858b) y el bootloader rechaza la imagen
    («Image hash failed»). Defensas para cualquier versión: tests/bench/grabado.py
    (fixture testbench) graba con 4 bytes 0xFF detrás si la imagen termina en un blanco
    y revisa «Wrote N bytes»; JRN-01.0 falla nombrando el grabado si el arranque dice
    «Image hash failed». tests/host/test_grabado.py en ci.yml (host-tests)

bench_coordination:   # condición del propietario (2026-11-14): el piloto tiene prioridad
  rule: no usar el banco mientras villa-nodo-clima-piloto tenga pruebas en curso
  before_each_bench_session:
    - comprobar con el propietario o en la UI del banco que no hay una sesión de pruebas del piloto activa
    - GET /api/devices (con el token de .env) y TestbenchDriver.get_devices(): SLOT1 (DUT del piloto) no debe estar flashing ni monitoring
    - tomar el candado compartido ~/villa/banco.lock (flock) con el nombre del repo y la hora; si está tomado, no se usa el banco
  during: solo SLOT2 (dut.slot); nunca se toca SLOT1 ni el AP o el broker si el piloto los está usando
  after: soltar el candado y dejar AP y broker en el estado en que estaban
  note: el piloto aún no toma el candado; hasta que lo haga, manda la comprobación con el propietario

tiers: [host, target, bench, bench+, field, other, manual]   # FSD §24.0 + convenciones

