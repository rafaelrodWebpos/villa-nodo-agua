banco_con_la_compra:   # qué se prueba en el banco cuando llegue la compra (agenda 2–5); el firmware ya lo tiene (2026-11-15)
  - paso: "0 · SLOT2 tras soldarle los pines (pendiente desde 2026-11-15)"
    que: "el propietario soldó los pines de la placa del SLOT2 y apagó el Pi; al encenderlo: GET /api/devices ve el SLOT2 (SLOT1 sin tocar), POST /api/chip/info con la MAC de dut.identity, JRN-01.0 con la imagen de banco de 3e3ffe7 (CI 43754845133, ya en .fw-run, ignorado por git) y espefuse summary con los valores de dut.identity.efuses_observed (todo en 0). Intento del 2026-11-15: not done, banco apagado (connect refused en :8080). Hecho 2026-11-18: pasa (JRN-01.0, dut.identity)"
  - paso: "1 · regresión en el SLOT2 sin E/S"
    que: "repetir JRN-01.0–01.3, los 20 heredados, TC-HA-A1, TC-WDT-02 y TC-TIME-08 con la imagen que ya incluye los drivers y la tarea de protección (sin la E/S montada los ADS no responden y la protección queda en falla_adc, sin mover nada)"
  - paso: "2 · agenda fila 2 (montaje de E/S)"
    que: "línea A7 «i2c: scan sda=8 scl=9 hz=100000 ack=0x48,0x49,0x4a» (C-HW-24); cada salida (IN1, IN2, relé, LED verde y rojo, zumbador) vista por bench-salidas-dut; IN1 e IN2 nunca a la vez (C-HW-22)"
  - paso: "3 · agenda fila 3 (válvula real)"
    que: "tiempo de carrera real frente a t_carrera_max_s 30 s (P3); finales en GPIO6/7 con su polaridad; FR-VAL-05 (≤ 100 ms) medido en banco; INT-4 (los dos finales → FALLA y falla_valvula)"
  - paso: "4 · agenda fila 4 (simuladores CR-TB-16…22)"
    que: "los contratos de banco de §5–§9 y §12 (FR-FUG-02, FR-SON-01…03, FR-IO-04…06, FR-BOM-01…09, FR-NIV-01/02, FR-PRE-01, FR-ENE-01…05, FR-LOC-01…05, FR-PER-01…03, FR-EJE-01…04, FR-OBS-A1) y JRN-01.4–01.8, JRN-02.0–02.2; cada uno se declara en el plan al empezar esta fase"
  - paso: "5 · agenda fila 5 (sensores reales)"
    que: "referencia de los lazos medida en A3 del 0x4A (FSD 0.6.0; cablear A3 a la tensión de las resistencias de 10 kΩ; fuera de 3,0–3,6 V usa 3,3 V nominales), R(mojada) con agua de la villa (P4), lazo de 4–20 mA a 24 V (C-HW-31), presión y pinza con carga conocida"
  - paso: "6 · revisar las interpretaciones"
    que: "INT-1…INT-6 con la E/S real"
interpretaciones:   # confirmadas por el propietario 2026-11-15; revisarlas cuando llegue la compra (agenda 2–5)
  - id: INT-1
    texto: expire_after (180 s) solo en los sensores de medida periódica, no en binary_sensor, valve, switch, button ni event
    revisar: con la E/S real, comprobar que las entidades sin expire_after reflejan bien la pérdida del nodo vía availability
  - id: INT-2
    texto: mientras no hay E/S, el «ciclo de medición» de clima:FR-CON-03/04 (FR-HER-01) se observa como el primer status online tras T11
    revisar: con la E/S, sustituir el sustituto por la primera publicación de medidas (línea A4 y tópicos de §13.1)
  - id: INT-3
    texto: FR-PUB-02 y las partes de medida de las pruebas heredadas (p. ej. TC-POR-12) llegan con el trabajo de E/S
    revisar: con la E/S, añadir esas aserciones y volver a ejecutar las pruebas afectadas
  - id: INT-4
    texto: con los dos finales activos (V03b, V15) la válvula pasa a FALLA y publica el evento falla_valvula (confirmada por el propietario 2026-11-15; FSD 0.5.0)
    revisar: con la válvula real, provocar los dos finales a la vez y ver falla_valvula
  - id: INT-5
    texto: V23 (reapertura por batería) exige también g_seco, como una apertura por orden (confirmada 2026-11-15; FSD 0.5.0)
    revisar: con la E/S, reapertura por batería con una sonda mojada → sin reapertura
  - id: INT-6
    texto: V22 solo desde ABIERTA o DESCONOCIDA; el evento es de nivel y se repite cada ciclo, así que una válvula que se estaba abriendo se cierra al llegar a ABIERTA (confirmada 2026-11-15; FSD 0.5.0)
    revisar: con la E/S, batería crítica sin red durante una apertura → cierre al llegar a abierta
