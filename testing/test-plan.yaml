tests:
  # JRN-01 — el recorrido ordinario (pregunta H2, propietario, 2026-11-14). Pasos en
  # orden; cada uno parte del estado del anterior. Es la puerta de cada sesión con
  # hardware y los primeros tests de la ola 1. impl lo escribe /build.
  - id: JRN-01.0
    shape: workflow
    kind: standard
    wave: 1
    phase: 1
    tier: bench
    verifies: [clima:C-HW-02]
    needs: [hosted-ci, bench-flash, bench-driver, bench-serial-monitor, dut-board]
    expect: >
      se graba en SLOT2 la imagen construida por la CI sobre el commit que se prueba, con los offsets de su flash_args y la NVS borrada; tras el reset aparecen la versión, NODO-BENCH-IMAGE (imagen de banco) e «Init complete»
    impl: tests/bench/test_jrn01.py::test_jrn_01_0_flash_ci_image
    status: successful
    commit: 3766991
    date: 2026-11-18
    ci_run: 43754845133
    evidence: test-results/20261119T002551Z-3766991/
    observed: >
      paso 0 de banco_con_la_compra (SLOT2 tras soldarle los pines): imagen
      0.0.0-3e3ffe7-bench (drivers de E/S, tarea de protección), grabada con la defensa
      de grabado: «Wrote N bytes» = lo enviado en los 5 offsets (la app termina en 0xd9,
      sin relleno); NODO-BENCH-IMAGE + Init complete; sin «Image hash failed». El reset
      de la captura es rst:0x15 (USB_UART_CHIP_RESET), el del banco. Antes: 44d29c2,
      2026-11-15, CI 43709844065.
  - id: JRN-01.1
    shape: workflow
    kind: standard
    wave: 1
    phase: 1
    tier: bench
    verifies: [clima:T02, clima:FR-POR-01, FR-ID-01]
    needs: [bench-portal-driver, bench-driver, bench-serial-monitor, dut-board]
